<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main/layout/base}">
<head>
    <title th:text="${pageTitle}"></title>
</head>
<body>
<div layout:fragment="content">

    <div class="container-fluid py-6">
        <div class="container">
            <div class="row g-5 align-items-center">
                <div class="col-lg-5 wow bounceInUp" data-wow-delay="0.1s">
                    <img src="/assets/img/aboutvinh.png" class="img-fluid rounded shadow"
                         th:alt="${school.schoolName}">
                </div>

                <div class="col-lg-7 wow bounceInUp" data-wow-delay="0.3s">
                    <small class="d-inline-block fw-bold text-dark text-uppercase bg-light border border-primary rounded-pill px-4 py-1 mb-3">
                        VinhUni Event - <span th:text="${school.schoolName}"></span>
                    </small>

                    <h1 class="display-5 mb-4" th:text="${school.schoolName}">
                        Trường Đại học Vinh
                    </h1>

                    <p class="mb-4 text-justify" th:utext="${school.description}">
                        Mô tả chi tiết về trường sẽ hiển thị tại đây...
                    </p>

                    <div class="row g-4 mb-4">
                        <div class="col-sm-6">
                            <div class="p-3 border-start border-primary border-4 bg-light">
                                <h5 class="text-primary"><i class="fas fa-bullseye me-2"></i>Sứ mạng</h5>
                                <p class="mb-0 small" th:text="${school.mission}"></p>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="p-3 border-start border-success border-4 bg-light">
                                <h5 class="text-success"><i class="fas fa-eye me-2"></i>Tầm nhìn</h5>
                                <p class="mb-0 small" th:text="${school.vision}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4 text-dark mb-5">
                        <div class="col-sm-6">
                            <i class="fas fa-map-marker-alt text-primary me-2"></i>
                            <strong>Địa chỉ:</strong> <span th:text="${school.address}"></span>
                        </div>
                        <div class="col-sm-6">
                            <i class="fas fa-phone-alt text-primary me-2"></i>
                            <strong>Hotline:</strong> <span th:text="${school.phone}"></span>
                        </div>
                        <div class="col-sm-6">
                            <i class="fas fa-envelope text-primary me-2"></i>
                            <strong>Email:</strong> <span th:text="${school.email}"></span>
                        </div>
                        <div class="col-sm-6">
                            <i class="fas fa-globe text-primary me-2"></i>
                            <a th:href="${school.website}" target="_blank" class="text-dark">Truy cập Website</a>
                        </div>
                    </div>

                    <div class="d-flex align-items-center">
                        <a href="/events" class="btn btn-primary py-3 px-5 rounded-pill me-4">
                            Khám Phá Sự Kiện <i class="fas fa-arrow-right ps-2"></i>
                        </a>
                        <div class="d-flex flex-column">
                            <span class="text-muted">Liên hệ ngay</span>
                            <span class="fw-bold text-dark" th:text="${school.phone}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
