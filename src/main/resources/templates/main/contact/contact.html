<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liên Hệ - VinhuniEvent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5 mb-5" style="max-width: 700px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h3>Gửi Liên Hệ / Góp Ý</h3>
        </div>
        <div class="card-body">

            <div th:if="${message}" class="alert alert-success text-center">
                <span th:text="${message}"></span>
            </div>

            <form th:action="@{/contact/save}" th:object="${contact}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Chủ đề <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{subject}" placeholder="VD: Hỗ trợ đăng ký sự kiện..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nội dung <span class="text-danger">*</span></label>
                    <textarea class="form-control" th:field="*{message}" rows="6" placeholder="Nhập nội dung chi tiết..." required></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Gửi Phản Hồi</button>
                </div>
            </form>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
