<div th:fragment="admin_side_bar">
    <nav id="sidebar" class="sidebar js-sidebar">
        <div class="sidebar-content js-simplebar">

            <a class="sidebar-brand d-flex align-items-center" href="/admin" style="padding-top: 1.5rem; padding-bottom: 1.5rem;">
                <img src="/uploads/logo.jpg" alt="Logo"
                     style="width: 35px; height: 35px; border-radius: 5px; margin-right: 10px; object-fit: cover;"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
                <i class="align-middle text-primary" data-feather="hexagon" style="display:none; margin-right: 10px;"></i>

                <span class="align-middle" style="font-size: 1.2rem; font-weight: 600;">VinhuniEvent</span>
            </a>

            <ul class="sidebar-nav">

                <li class="sidebar-header">
                    Tổng quan
                </li>

                <li class="sidebar-item" th:classappend="${currentPage == 'dashboard'} ? 'active'">
                    <a class="sidebar-link" th:href="@{/admin}">
                        <i class="align-middle" data-feather="sliders"></i>
                        <span class="align-middle">Dashboard</span>
                    </a>
                </li>

                <li class="sidebar-header">
                    Hệ thống
                </li>

                <li class="sidebar-item" th:classappend="${currentPage == 'users'} ? 'active'">
                    <a class="sidebar-link" th:href="@{/admin/users}">
                        <i class="align-middle" data-feather="users"></i>
                        <span class="align-middle">Người dùng</span>
                    </a>
                </li>

                <li class="sidebar-item" th:classappend="${currentPage == 'roles'} ? 'active'">
                    <a class="sidebar-link" th:href="@{/admin/roles}">
                        <i class="align-middle" data-feather="shield"></i>
                        <span class="align-middle">Phân quyền</span>
                    </a>
                </li>

                <li class="sidebar-item" th:classappend="${currentPage == 'role-requests'} ? 'active'">
                    <a class="sidebar-link" th:href="@{/admin/role-requests}">
                        <i class="align-middle" data-feather="user-check"></i>
                        <span class="align-middle">Yêu cầu nâng quyền</span>
                    </a>
                </li>

                <li class="sidebar-header">
                    Quản lý Sự kiện
                </li>

                <li class="sidebar-item" th:classappend="${currentPage == 'categories'} ? 'active'">
                    <a class="sidebar-link" th:href="@{/admin/event_categories}">
                        <i class="align-middle" data-feather="layers"></i>
                        <span class="align-middle">Danh mục</span>
                    </a>
                </li>

                <li class="sidebar-item" th:classappend="${currentPage == 'events'} ? 'active'">
                    <a class="sidebar-link" th:href="@{/admin/events}">
                        <i class="align-middle" data-feather="calendar"></i>
                        <span class="align-middle">Danh sách sự kiện</span>
                    </a>
                </li>

                <li class="sidebar-item" th:classappend="${currentPage == 'registrations'} ? 'active'">
                    <a class="sidebar-link" th:href="@{/admin/event_register}">
                        <i class="align-middle" data-feather="clipboard"></i>
                        <span class="align-middle">Đăng ký tham gia</span>
                    </a>
                </li>

                <li class="sidebar-header">
                    Cài đặt
                </li>

                <li class="sidebar-item">
                    <a class="sidebar-link" href="#">
                        <i class="align-middle" data-feather="settings"></i>
                        <span class="align-middle">Cấu hình chung</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</div>
