<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/base}">
<head>
    <title>Quản lý liên hệ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content">
<div class="container-fluid p-4">
    <h2 class="mb-4">Danh sách phản hồi từ người dùng</h2>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Ngày gửi</th>
                    <th>Người gửi (ID)</th>
                    <th>Chủ đề</th>
                    <th>Nội dung</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${contacts}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${#dates.format(c.createdAt, 'dd-MM-yyyy HH:mm')}"></td>

                    <td th:text="${c.userId != null ? c.userId : 'Khách vãng lai'}"></td>

                    <td th:text="${c.subject}" class="fw-bold"></td>

                    <td th:text="${#strings.abbreviate(c.message, 50)}"></td>

                    <td>
                        <span th:if="${c.read}" class="badge bg-success">Đã xem</span>
                        <span th:unless="${c.read}" class="badge bg-warning text-dark">Mới</span>
                    </td>

                    <td>
                        <a th:href="@{/admin/contacts/delete/{id}(id=${c.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa tin nhắn này?');">
                            Xóa
                        </a>
                    </td>
                </tr>

                <tr th:if="${contacts.empty}">
                    <td colspan="7" class="text-center text-muted">Chưa có liên hệ nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
</body>
</html>
