<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/base}">
<head>
    <title th:text="${pageTitle}"></title>
</head>
<body>
<div layout:fragment="content" class="container-fluid px-4">
    <h2 class="mt-4" th:text="${pageTitle}"></h2>

    <div class="card shadow mb-4 col-xl-8">
        <div class="card-header bg-primary text-white">
            <i class="fas fa-user-edit me-1"></i> Thông tin chi tiết
        </div>
        <div class="card-body">
            <form th:action="@{/admin/users/save}" th:object="${user}" method="post">

                <input type="hidden" th:field="*{userId}" />

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Họ và tên:</label>
                        <input type="text" th:field="*{fullName}" class="form-control" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Email:</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:readonly="${user.userId != null}" required />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Mật khẩu:</label>
                        <input type="password" th:field="*{passwordHash}" class="form-control"
                               th:required="${user.userId == null}"
                               placeholder="Để trống nếu không muốn đổi mật khẩu" />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Vai trò:</label>
                        <select th:field="*{role}" class="form-select" required>
                            <option value="">-- Chọn quyền --</option>
                            <option th:each="r : ${roles}"
                                    th:value="${r.roleId}"
                                    th:text="${r.roleName}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Mã sinh viên:</label>
                        <input type="text" th:field="*{studentCode}" class="form-control" />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Khoa:</label>
                        <input type="text" th:field="*{faculty}" class="form-control" />
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ngành:</label>
                        <input type="text" th:field="*{major}" class="form-control" />
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Trạng thái tài khoản:</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="isActiveSwitch">
                            <label class="form-check-label" for="isActiveSwitch">Hoạt động (Active)</label>
                        </div>
                        <div class="form-text">Nếu tắt, người dùng này sẽ không thể đăng nhập vào hệ thống.</div>
                    </div>
                </div>
                <div class="mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Lưu lại
                    </button>
                    <a th:href="@{/admin/users}" class="btn btn-secondary">Quay lại</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
