<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/base}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Người dùng</title>
    <style>
        :root {
            --primary: #0d6efd;
            --success: #1abc9c;
            --danger: #e74c3c;
            --info: #3498db;
            --gray: #f5f6fa;
        }
        body { background: var(--gray); }
        .page-title { font-weight: 700; color: #2c3e50; }
        .card-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-radius: 10px; }
        .filter-tabs .btn { border-radius: 6px; font-weight: 600; }
        .filter-tabs .btn.active { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(13,110,253,.2); }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; }
        .search-box input { padding-left: 36px; }
        .table thead th { background: #fff; color: #6c757d; border-bottom: 1px solid #e9ecef; font-weight: 600; }
        .table tbody tr { background: #fff; transition: all .15s; }
        .table tbody tr:hover { transform: translateX(2px); box-shadow: 0 6px 18px rgba(0,0,0,0.04); }
        .badge-role { padding: 0.35em 0.65em; border-radius: 999px; font-weight: 600; }
        .status-dot { font-size: 10px; margin-right: 6px; }
        .actions .btn { padding: 4px 10px; }
    </style>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="page-title mb-0">Quản lý người dùng</h4>
            <small class="text-muted">Quản lý thông tin người dùng, sinh viên, ban tổ chức và quản trị hệ thống.</small>
        </div>
        <a th:href="@{/admin/users/new}" class="btn btn-success fw-semibold">
            <i class="bi bi-person-plus-fill me-1"></i> Thêm mới người dùng
        </a>
    </div>

    <div class="card card-shadow mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-center mb-3">
                <div class="col-lg-7">
                    <div class="btn-group filter-tabs" role="group">
                        <a th:href="@{/admin/users}" class="btn btn-outline-primary" th:classappend="${filter == 'all'}? ' active'">Tất cả</a>
                        <a th:href="@{/admin/users?role=student}" class="btn btn-outline-primary" th:classappend="${filter == 'student'}? ' active'">Sinh viên</a>
                        <a th:href="@{/admin/users?role=organizer}" class="btn btn-outline-primary" th:classappend="${filter == 'organizer'}? ' active'">Ban tổ chức</a>
                        <a th:href="@{/admin/users?role=admin}" class="btn btn-outline-primary" th:classappend="${filter == 'admin'}? ' active'">Quản trị viên</a>
                    </div>
                </div>
                <div class="col-lg-5">
                    <form class="search-box" th:action="@{/admin/users}" method="get">
                        <i class="bi bi-search"></i>
                        <input type="hidden" name="role" th:value="${filter != 'all' ? filter : ''}">
                        <input name="keyword" th:value="${keyword}" type="text" class="form-control" placeholder="Tìm kiếm theo tên, email, mã SV...">
                    </form>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="text-muted">MÃ SV</th>
                        <th class="text-muted">HỌ TÊN</th>
                        <th class="text-muted">EMAIL</th>
                        <th class="text-muted">KHOA</th>
                        <th class="text-muted">NGÀNH</th>
                        <th class="text-muted">VAI TRÒ</th>
                        <th class="text-muted text-center">TRẠNG THÁI</th>
                        <th class="text-muted text-center">HÀNH ĐỘNG</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.studentCode != null ? user.studentCode : '-'}">SV000</td>
                        <td th:text="${user.fullName}">Họ tên</td>
                        <td th:text="${user.email}">email@example.com</td>
                        <td th:text="${user.faculty}">Khoa</td>
                        <td th:text="${user.major}">Ngành</td>
                        <td>
                            <span class="badge-role bg-light text-dark" th:text="${user.role != null ? user.role.roleName : 'N/A'}"></span>
                        </td>
                        <td class="text-center">
                            <span th:classappend="${user.isActive} ? 'text-success' : 'text-danger'">
                                <i class="bi bi-circle-fill status-dot"></i>
                                <span th:text="${user.isActive} ? 'Hoạt động' : 'Khóa'"></span>
                            </span>
                        </td>
                        <td class="text-center actions">
                            <a th:href="@{/admin/users/view/{id}(id=${user.userId})}" class="btn btn-outline-primary btn-sm">Chi tiết</a>
                            <a th:href="@{/admin/users/edit/{id}(id=${user.userId})}" class="btn btn-outline-secondary btn-sm">Sửa</a>
                            <a th:href="@{/admin/users/delete/{id}(id=${user.userId})}" class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này?');">Xóa</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
