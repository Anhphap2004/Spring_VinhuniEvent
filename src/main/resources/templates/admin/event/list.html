<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/base}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sự kiện</title>
    <style>
        :root {
            --border-color: #e0e0e0;
            --bg-gray: #f5f5f5;
            --text-dark: #333;
            --text-gray: #666;
            --text-light: #999;
            --success-bg: #d4edda;
            --success-border: #c3e6cb;
            --success-text: #155724;
            --error-bg: #f8d7da;
            --error-border: #f5c6cb;
            --error-text: #721c24;
        }

        /* CONTAINER */
        .min-main {
            padding: 20px 40px;
            max-width: 100%;
            margin: 0;
        }

        /* HEADER */
        .min-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .min-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0;
        }

        /* ALERT MESSAGE */
        .min-alert {
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid;
            font-size: 14px;
            border-radius: 4px;
        }

        .min-alert-success {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .min-alert-error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }

        /* BUTTONS */
        .min-btn {
            display: inline-block;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            white-space: nowrap;
        }

        .min-btn:hover {
            background: var(--bg-gray);
            color: var(--text-dark);
        }

        .min-btn i {
            margin-right: 5px;
            font-size: 11px;
        }

        .min-btn-add {
            background: var(--text-dark);
            color: #fff !important;
            border-color: var(--text-dark);
        }

        .min-btn-add:hover {
            opacity: 0.85;
            color: #fff !important;
            background: var(--text-dark);
        }

        .min-btn-small {
            padding: 6px 10px;
            font-size: 12px;
            margin-right: 6px;
        }

        .min-btn-small:last-child {
            margin-right: 0;
        }

        .min-btn-info {
            background: #fff;
            color: #17a2b8;
            border-color: #17a2b8;
        }

        .min-btn-info:hover {
            background: #17a2b8;
            color: #fff;
        }

        .min-btn-warning {
            background: #fff;
            color: #ffc107;
            border-color: #ffc107;
        }

        .min-btn-warning:hover {
            background: #ffc107;
            color: var(--text-dark);
        }

        .min-btn-danger {
            background: #fff;
            color: #dc3545;
            border-color: #dc3545;
        }

        .min-btn-danger:hover {
            background: #dc3545;
            color: #fff;
        }

        /* CARD */
        .min-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .min-card-body {
            padding: 0;
        }

        /* TABLE */
        .min-table-wrapper {
            overflow-x: auto;
            max-width: 100%;
        }

        .min-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            margin: 0;
        }

        .min-table thead {
            background: var(--bg-gray);
            border-bottom: 1px solid var(--border-color);
        }

        .min-table thead th {
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-gray);
            text-transform: uppercase;
            border: none;
            white-space: nowrap;
        }

        .min-table tbody tr {
            border-bottom: 1px solid var(--border-color);
        }

        .min-table tbody tr:last-child {
            border-bottom: none;
        }

        .min-table tbody tr:hover {
            background-color: #fafafa;
        }

        .min-table tbody td {
            padding: 12px 15px;
            font-size: 14px;
            color: var(--text-dark);
            vertical-align: middle;
            border: none;
        }

        /* TABLE COLUMNS SPECIFIC */
        .min-table tbody td:first-child {
            color: var(--text-light);
            font-size: 13px;
            width: 50px;
            text-align: center;
        }

        .min-table thead th:first-child {
            text-align: center;
        }

        .min-col-image {
            text-align: center;
            width: 110px;
        }

        .min-event-img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .min-col-title {
            width: auto;
        }

        .min-col-category {
            width: 130px;
        }

        .min-col-datetime {
            width: 150px;
            white-space: nowrap;
        }

        .min-col-status {
            width: 110px;
            text-align: center;
        }

        .min-table thead th.min-col-status {
            text-align: center;
        }

        .min-col-actions {
            width: 240px;
            white-space: nowrap;
            text-align: center;
        }

        .min-table thead th.min-col-actions {
            text-align: center;
        }

        /* BADGE */
        .min-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .min-badge-success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .min-badge-secondary {
            background: var(--bg-gray);
            color: var(--text-gray);
            border: 1px solid var(--border-color);
        }

        /* EMPTY STATE */
        .min-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-size: 14px;
        }

        /* SEARCH BOX */
        .min-search-wrapper {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .min-search-box {
            display: flex;
            gap: 0;
            flex: 1;
            min-width: 300px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }

        .min-search-input {
            flex: 1;
            padding: 10px 15px;
            font-size: 14px;
            border: none;
            background: #fff;
            color: var(--text-dark);
        }

        .min-search-input:focus {
            outline: none;
        }

        .min-search-input::placeholder {
            color: var(--text-light);
        }

        .min-btn-search {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 500;
            background: var(--text-dark);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .min-btn-search:hover {
            opacity: 0.85;
        }

        .min-search-clear {
            padding: 10px 16px;
            font-size: 13px;
            background: var(--bg-gray);
            border: 1px solid var(--border-color);
            color: var(--text-gray);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .min-search-clear:hover {
            background: var(--text-dark);
            color: #fff;
            border-color: var(--text-dark);
        }

        /* NO RESULTS MESSAGE */
        .min-no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            font-size: 14px;
            display: none;
        }

        .min-no-results.show {
            display: table-row;
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .min-main {
                padding: 20px 25px;
            }
        }

        @media (max-width: 768px) {
            .min-main {
                padding: 15px;
            }

            .min-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .min-title {
                font-size: 16px;
            }

            .min-btn-add {
                width: 100%;
                text-align: center;
            }

            .min-table thead th,
            .min-table tbody td {
                padding: 10px 8px;
                font-size: 12px;
            }

            /* Hide less important columns on mobile */
            .min-table thead th:nth-child(3),
            .min-table tbody td:nth-child(3),
            .min-table thead th:nth-child(4),
            .min-table tbody td:nth-child(4) {
                display: none;
            }

            .min-col-actions {
                width: auto;
            }

            .min-btn-small {
                padding: 5px 8px;
                font-size: 11px;
                margin-right: 4px;
                margin-bottom: 4px;
            }

            .min-btn-small i {
                margin-right: 3px;
            }
        }

        @media (max-width: 576px) {
            .min-table thead th:nth-child(5),
            .min-table tbody td:nth-child(5) {
                display: none;
            }

            .min-col-actions {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .min-btn-small {
                width: 100%;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="min-main">

    <!-- HEADER -->
    <div class="min-header">
        <h1 class="min-title">Danh sách Sự kiện</h1>
        <a th:href="@{/admin/events/create}" class="min-btn min-btn-add">
            <i class="fas fa-plus"></i> Thêm mới Sự kiện
        </a>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${successMessage}" class="min-alert min-alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <!-- ERROR MESSAGE -->
    <div th:if="${errorMessage}" class="min-alert min-alert-error" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- SEARCH BOX -->
    <div class="min-search-wrapper">
        <form th:action="@{/admin/events}" method="get" class="min-search-box" style="display: flex; gap: 5px;">

            <input type="text"
                   name="keyword"
                   id="searchInput"
                   th:value="${keyword}"
                   class="min-search-input"
                   placeholder="Tìm kiếm...">

            <button type="submit" class="min-btn-search">
                <i class="fas fa-search"></i> Tìm kiếm
            </button>

            <a th:href="@{/admin/events}" class="min-search-clear" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-times"></i> Xóa
            </a>

            <a th:href="@{/admin/events}" class="min-search-clear" style="text-decoration: none; display: flex; align-items: center;" title="Hiện tất cả">
                <i class="fas fa-list"></i> Tất cả
            </a>

        </form>
    </div>

    <!-- CARD TABLE -->
    <div class="min-card">
        <div class="min-card-body">
            <div class="min-table-wrapper">
                <table class="min-table">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col" class="min-col-title">Tên sự kiện</th>
                        <th scope="col" class="min-col-image">Hình ảnh</th>
                        <th scope="col" class="min-col-category">Danh mục</th>
                        <th scope="col" class="min-col-datetime">Bắt đầu</th>
                        <th scope="col" class="min-col-status">Trạng thái</th>
                        <th scope="col" class="min-col-actions">Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="eventTableBody">
                    <!-- EMPTY STATE -->
                    <tr th:if="${#lists.isEmpty(events)}" id="emptyState">
                        <td colspan="7" class="min-empty">
                            Chưa có sự kiện nào. Hãy thêm sự kiện mới!
                        </td>
                    </tr>

                    <!-- NO RESULTS MESSAGE -->
                    <tr id="noResults" class="min-no-results">
                        <td colspan="7" class="min-empty">
                            Không tìm thấy sự kiện nào phù hợp với từ khóa tìm kiếm.
                        </td>
                    </tr>

                    <!-- EVENT ROWS -->
                    <tr th:each="item : ${events}" class="event-row"
                        th:data-title="${item.title}"
                        th:data-category="${item.category != null ? item.category.category_name : 'N/A'}"
                        th:data-datetime="${#temporals.format(item.startTime, 'dd/MM/yyyy HH:mm')}"
                        th:data-status="${item.is_active ? 'Hoạt động' : 'Tạm ẩn'}">
                        <td th:text="${item.event_id}">1</td>
                        <td class="min-col-title" th:text="${item.title}">Sự kiện mẫu</td>
                        <td class="min-col-image">
                            <img th:src="${item.image}"
                                 alt="Ảnh sự kiện"
                                 class="min-event-img">
                        </td>
                        <td class="min-col-category"
                            th:text="${item.category != null ? item.category.category_name : 'N/A'}">
                            Thể thao
                        </td>
                        <td class="min-col-datetime"
                            th:text="${#temporals.format(item.startTime, 'dd/MM/yyyy HH:mm')}">
                            18/12/2025 14:30
                        </td>
                        <td class="min-col-status">
                            <span th:if="${item.is_active}" class="min-badge min-badge-success">
                                Hoạt động
                            </span>
                            <span th:unless="${item.is_active}" class="min-badge min-badge-secondary">
                                Tạm ẩn
                            </span>
                        </td>
                        <td class="min-col-actions">
                            <a th:href="@{/admin/events/detail/{id}(id=${item.event_id})}"
                               class="min-btn min-btn-small min-btn-info"
                               th:aria-label="'Chi tiết sự kiện ' + ${item.title}">
                                <i class="fas fa-eye"></i> Chi tiết
                            </a>
                            <a th:href="@{/admin/events/edit/{id}(id=${item.event_id})}"
                               class="min-btn min-btn-small min-btn-warning"
                               th:aria-label="'Sửa sự kiện ' + ${item.title}">
                                <i class="fas fa-edit"></i> Sửa
                            </a>
                            <form th:action="@{/admin/events/delete/{id}(id=${item.event_id})}"
                                  method="post"
                                  style="display: inline;"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa sự kiện này?');">
                                <button type="submit"
                                        class="min-btn min-btn-small min-btn-danger"
                                        th:aria-label="'Xóa sự kiện ' + ${item.title}">
                                    <i class="fas fa-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>



</body>
</html>
