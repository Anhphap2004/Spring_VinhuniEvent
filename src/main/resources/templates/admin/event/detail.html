<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/base}">

<head>
    <title th:text="${'Chi tiết: ' + event.title}"></title>
</head>

<div layout:fragment="content">
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">Chi tiết Sự kiện</h6>
            <div>
                <a th:href="@{/admin/events/edit/{id}(id=${event.event_id})}" class="btn btn-warning btn-sm">Sửa</a>
                <a th:href="@{/admin/events}" class="btn btn-secondary btn-sm">Quay lại</a>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <img th:src="${event.image != null ? event.image : 'https://placehold.co/400x300'}"
                         class="img-fluid rounded shadow-sm mb-3" alt="Event Image">

                    <ul class="list-group">
                        <li class="list-group-item"><strong>ID:</strong> <span th:text="${event.event_id}"></span></li>
                        <li class="list-group-item"><strong>Người tạo:</strong> <span th:text="${event.created_by != null ? event.created_by.fullName : 'Admin'}"></span></li>
                        <li class="list-group-item"><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(event.created_date, 'dd/MM/yyyy')}"></span></li>
                        <li class="list-group-item"><strong>Số lượng tối đa:</strong> <span th:text="${event.max_participants}"></span></li>
                    </ul>
                </div>
                <div class="col-md-8">
                    <h2 class="text-primary" th:text="${event.title}"></h2>
                    <p class="text-muted">
                        <i class="fas fa-folder"></i> <span th:text="${event.category != null ? event.category.category_name : 'Chưa phân loại'}"></span>
                        |
                        <i class="fas fa-map-marker-alt"></i> <span th:text="${event.location}"></span>
                    </p>

                    <div class="alert alert-info">
                        <strong><i class="far fa-clock"></i> Thời gian:</strong> <br>
                        Từ: <span th:text="${#temporals.format(event.startTime, 'HH:mm dd/MM/yyyy')}"></span> <br>
                        Đến: <span th:text="${#temporals.format(event.endTime, 'HH:mm dd/MM/yyyy')}"></span>
                    </div>

                    <h5 class="mt-4">Mô tả ngắn:</h5>
                    <p th:text="${event.description}"></p>

                    <h5 class="mt-4">Nội dung chi tiết:</h5>
                    <div class="border p-3 bg-light rounded" th:text="${event.detail}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
