<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Không có quyền truy cập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .access-denied-container {
            background: white;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #ddd;
        }

        .icon-container {
            margin-bottom: 30px;
        }

        .icon-container i {
            font-size: 80px;
            color: #dc3545;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .user-role {
            background: #fff3cd;
            color: #856404;
            padding: 8px 20px;
            display: inline-block;
            font-weight: bold;
            margin: 20px 0;
        }

        .btn-back {
            background: #007bff;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            border: none;
        }

        hr {
            border: 0;
            border-top: 2px solid #ddd;
            margin: 30px 0;
        }
    </style>
</head>
<body>

<div class="access-denied-container">
    <div class="icon-container">
        <i class="fas fa-lock"></i>
    </div>

    <div class="error-code">403</div>

    <h1 class="error-title">Truy cập bị từ chối</h1>

    <hr>

    <p class="error-message">
        Tài khoản của bạn không có quyền truy cập vào chức năng này.
    </p>

    <div class="user-role">
        Organization Account
    </div>

    <p class="error-message">
        Vui lòng liên hệ Admin để được cấp quyền
    </p>

    <a th:href="@{/admin}" class="btn-back">
        <i class="fas fa-arrow-left"></i> Quay lại Dashboard
    </a>
</div>

</body>
</html>
